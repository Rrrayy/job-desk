name: CI

# 九步全绿才算过（顺序与 app/package.json 的 `verify` 完全一致，改一边请改另一边）：
#   ① 类型  ② 单测  ③ lint  ④ 零网络扫描  ⑤ 构建  ⑥ 产物体积（总量 + CSS/JS/中文 分项）  ⑦ 样式类名  ⑧ 版本号一致  ⑨ 社区面经校验
#
# 每一步都对应产品的一条硬承诺，不是「顺手加上去」的检查：
#   ④ 对应「数据不出本机」，⑥ 对应「单文件双击就能用」，⑨ 对应「社区数据不许带隐私」。
# 任何一步红都必须让整条流水线红，并让人从日志一行看出是哪一道（step name 带序号）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 只测仍在维护期的 LTS。两条硬事实决定这里不能写 18 / 20：
        #   ① Node 18 于 2025-04-30 EOL，Node 20 于 2026-04-30 EOL，测它们是给死版本交保护费；
        #   ② 工具链自己就不支持 —— jsdom@30 要 `^22.22.2 || ^24.15.0 || >=26`（连 node 20 都不满足，
        #      连带 whatwg-url / tr46 / data-urls / undici 共 9 个包），eslint@10 要
        #      `^20.19.0 || ^22.13.0 || >=24`（node 18 不满足，连带 @eslint/* 共 21 个包）。
        #      而 jsdom 构造失败会让所有 `.tsx` 测试在挂载 React 之前就报错，表现为
        #      「单测 17 秒就红」（本地全量 198 秒），极难从日志看出是环境问题。
        # 曾经这里写的是 ['18','20']，于是两档都必红、连红 21 次。改矩阵前先跑一遍：
        #   node scripts/check-engines.mjs
        #
        # 为什么暂时只有 22（2026-11-19）：改成 ['22','24'] 后实测
        #   verify (node 22) → 九步全绿（② 单测 48s，① tsc 7s）← 2026-10-21 以来第一条全绿的腿
        #   verify (node 24) → ① tsc 2 秒失败，exit code 2，后续八步全 skipped
        # exit code 2 不是类型错误（那是 1，且要 7s），是 tsc 自身在 node 24 上崩掉。
        # **原因尚未查明**（job 日志需要 token）。在查明前不把一条必然红的档位留在矩阵里 ——
        # 红着的 CI 等于没有 CI，它会让后面所有改动都失去判据。
        # 恢复 24 的两个条件（任一）：① 拿到 tsc 在 node 24 上的真实报错并修掉；
        # ② 升级 typescript 后本地用 node 24 复现通过。恢复时请把这段注释一起改回。
        node: ['22']

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: ① 类型检查（tsc --noEmit，0 error）
        run: npx tsc --noEmit

      - name: ② 单元测试（vitest，全绿）
        run: npm test

      - name: ③ lint（eslint src + scripts，0 error / 0 warning）
        run: npm run lint

      - name: ④ 零网络扫描（app/src + extension，0 处外发请求）
        run: npm run check:no-network

      - name: ⑤ 构建单文件产物
        run: npm run build

      - name: ⑥ 产物体积（总量 >960KB 警告 / >1024KB 失败；分项 CSS >100KB / JS >780KB / 中文 >85KB 直接失败）
        run: npm run check:bundle

      - name: ⑦ 样式类名一致性（tokenize-classes --check，0 处漂移）
        run: npm run check:classes

      - name: ⑧ 版本号一致（app/package.json 与扩展 manifest 对齐）
        run: npm run check:versions

      - name: ⑨ 社区面经格式与脱敏（0 处隐私字段）
        run: npm run validate:community

      - name: 产物存档（方便 review 时下载来看）
        uses: actions/upload-artifact@v4
        with:
          name: dist-html-node${{ matrix.node }}
          path: app/dist/index.html
          if-no-files-found: error
          retention-days: 14
